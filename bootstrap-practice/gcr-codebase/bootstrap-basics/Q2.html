<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Portfolio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="q2.css">
</head>

<body class="bg-light text-dark">

<header class="text-center mt-4 mb-3">
    <h1 class="fw-bold">Shreyash Rathore</h1>
    <p class="lead">Data Science Student & Aspiring Software Developer</p>
</header>

<main>

    <section class="container text-center p-5">

        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=300&q=80"
             alt="Profile"
             class="img-fluid rounded-circle profile-img mb-4">

        <h2 class="fw-bold">Hello, I'm Shreyash</h2>

        <p class="mt-3">
            I am passionate about programming, data science,
            artificial intelligence and web development.
        </p>

        <div class="mt-4">
            <a href="#" class="btn btn-primary me-2">
                Hire Me
            </a>

            <a href="#" class="btn btn-outline-dark">
                Download CV
            </a>
        </div>

    </section>

    <section class="container mb-5">
        <div class="row justify-content-center">

            <div class="col-md-7">

                <div class="card shadow-sm p-4">

                    <h3 class="text-center fw-bold mb-4">
                        Contact Me
                    </h3>

                    <form>

                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text"
                                   class="form-control"
                                   placeholder="Enter your name">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email"
                                   class="form-control"
                                   placeholder="Enter your email">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Message</label>
                            <textarea class="form-control"
                                      rows="4"
                                      placeholder="Write your message"></textarea>
                        </div>

                        <button type="submit"
                                class="btn btn-dark w-100">
                            Send Message
                        </button>

                    </form>

                </div>

            </div>

        </div>
    </section>

</main>

<footer class="bg-dark text-white text-center p-3">
    <p class="mb-0">© 2026 Shreyash Rathore</p>
</footer>

</body>
</html>
