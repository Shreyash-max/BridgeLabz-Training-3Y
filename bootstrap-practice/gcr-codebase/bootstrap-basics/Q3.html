<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Catalog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="q3.css">
</head>

<body>

<header class="bg-dark text-white text-center p-4">
    <h1>TechStore</h1>
    <p class="mb-0">Quality Products at Great Prices</p>
</header>

<main>

<section class="container py-5">

    <h2 class="text-center mb-5 fw-bold">
        Featured Products
    </h2>

    <div class="row g-4">

        <!-- col-md-3 = 4 columns on medium+ screens -->
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card product-card shadow-sm h-100">

                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80"
                     class="card-img-top"
                     alt="Smart Watch">

                <div class="card-body text-center">
                    <h5 class="card-title">Smart Watch</h5>
                    <p class="text-muted">₹2,999</p>

                    <button class="btn btn-primary">
                        Add to Cart
                    </button>
                </div>

            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card product-card shadow-sm h-100">

                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80"
                     class="card-img-top"
                     alt="Headphones">

                <div class="card-body text-center">
                    <h5 class="card-title">Headphones</h5>
                    <p class="text-muted">₹1,999</p>

                    <button class="btn btn-primary">
                        Add to Cart
                    </button>
                </div>

            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card product-card shadow-sm h-100">

                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80"
                     class="card-img-top"
                     alt="Running Shoes">

                <div class="card-body text-center">
                    <h5 class="card-title">Running Shoes</h5>
                    <p class="text-muted">₹3,499</p>

                    <button class="btn btn-primary">
                        Add to Cart
                    </button>
                </div>

            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card product-card shadow-sm h-100">

                <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=600&q=80"
                     class="card-img-top"
                     alt="Laptop">

                <div class="card-body text-center">
                    <h5 class="card-title">Laptop</h5>
                    <p class="text-muted">₹59,999</p>

                    <button class="btn btn-primary">
                        Add to Cart
                    </button>
                </div>

            </div>
        </div>

    </div>

</section>

</main>

<footer class="bg-dark text-white text-center p-3">
    © 2026 TechStore
</footer>

</body>
</html>
