<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Styled Buttons</title>

    <link rel="stylesheet" href="q5.css">
</head>

<body>

    <header>
        <h1>Styled Button Collection</h1>
    </header>

    <main class="button-container">

        <button class="primary">
            Primary Button
        </button>

        <button class="secondary">
            Secondary Button
        </button>

        <button class="outline">
            Outline Button
        </button>

        <button class="disabled" disabled>
            Disabled Button
        </button>

    </main>

    <footer>
        <p>Try hover, focus and click effects.</p>
    </footer>

</body>
</html>
