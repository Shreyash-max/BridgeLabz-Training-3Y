<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Tooltips</title>

    <link rel="stylesheet" href="q2.css">
</head>

<body>

    <header>
        <h1>CSS Tooltip Demonstration</h1>
    </header>

    <main class="tooltip-container">

        <!-- Tooltip 1 -->
        <div class="tooltip-box">
            HTML
            <span class="tooltip">HyperText Markup Language</span>
        </div>

        <!-- Tooltip 2 -->
        <div class="tooltip-box">
            CSS
            <span class="tooltip">Cascading Style Sheets</span>
        </div>

        <!-- Tooltip 3 -->
        <div class="tooltip-box">
            Flexbox
            <span class="tooltip">One-dimensional layout system</span>
        </div>

        <!-- Tooltip 4 -->
        <div class="tooltip-box">
            Grid
            <span class="tooltip">Two-dimensional layout system</span>
        </div>

    </main>

    <footer>
        <p>Hover over each word to see the tooltip.</p>
    </footer>

</body>
</html>
