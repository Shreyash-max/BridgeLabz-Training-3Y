<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UI Components</title>

    <link rel="stylesheet" href="q7.css">
</head>

<body>

    <header>
        <h1>User Interface Components</h1>
    </header>

    <main class="main-container">

        <section class="card">

            <h2>Search Dashboard</h2>

            <!-- Search bar -->
            <label for="search">Search</label>

            <input
                type="search"
                id="search"
                placeholder="Search here..."
            >

            <!-- Dropdown -->
            <label for="category">Category</label>

            <select id="category">
                <option>Select Category</option>
                <option>HTML</option>
                <option>CSS</option>
                <option>Java</option>
            </select>

            <!-- Buttons -->
            <div class="buttons">
                <button>Search</button>
                <button class="reset">Reset</button>
            </div>

        </section>

    </main>

    <footer>
        <p>Simple Responsive UI</p>
    </footer>

</body>
</html>
