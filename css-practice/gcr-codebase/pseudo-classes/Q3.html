<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Showcase</title>

    <link rel="stylesheet" href="q3.css">
</head>

<body>

    <header>
        <h1>Image Showcase</h1>
        <p>Responsive CSS Grid Gallery</p>
    </header>

    <main class="gallery">

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/500/350?random=1"
                     alt="Nature">
                <div class="overlay"></div>
            </div>
            <figcaption>Nature</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/500/350?random=2"
                     alt="Mountains">
                <div class="overlay"></div>
            </div>
            <figcaption>Mountains</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/500/350?random=3"
                     alt="City">
                <div class="overlay"></div>
            </div>
            <figcaption>City</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/500/350?random=4"
                     alt="Forest">
                <div class="overlay"></div>
            </div>
            <figcaption>Forest</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/500/350?random=5"
                     alt="Ocean">
                <div class="overlay"></div>
            </div>
            <figcaption>Ocean</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/500/350?random=6"
                     alt="Travel">
                <div class="overlay"></div>
            </div>
            <figcaption>Travel</figcaption>
        </figure>

    </main>

    <footer>
        <p>Assignment 8 - Question 3</p>
    </footer>

</body>
</html>
