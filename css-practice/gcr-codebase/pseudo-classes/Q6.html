<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Animations</title>

    <link rel="stylesheet" href="q6.css">
</head>

<body>

    <header>
        <h1>CSS Animation Demonstration</h1>
    </header>

    <main class="animation-container">

        <!-- Moving box -->
        <div class="moving-box">
            Moving Box
        </div>

        <!-- Bouncing ball -->
        <div class="ball">
            Ball
        </div>

        <!-- Color changing text -->
        <h2 class="color-text">
            Color Changing Text
        </h2>

    </main>

    <footer>
        <p>Animations created using CSS @keyframes</p>
    </footer>

</body>
</html>
