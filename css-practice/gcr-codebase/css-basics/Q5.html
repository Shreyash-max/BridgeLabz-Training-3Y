<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pricing Plans</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="pricing-wrapper">
    <div class="plan-card">
      <div>
        <h2>Basic</h2>
        <div class="price">$9/mo</div>
        <ul>
          <li>1 Project</li>
          <li>5GB Storage</li>
          <li>Community Support</li>
        </ul>
      </div>
      <a href="#" class="btn">Choose Basic</a>
    </div>
    
    <div class="plan-card popular">
      <div>
        <h2>Standard</h2>
        <div class="price">$29/mo</div>
        <ul>
          <li>10 Projects</li>
          <li>50GB Storage</li>
          <li>Priority Email Support</li>
        </ul>
      </div>
      <a href="#" class="btn">Choose Standard</a>
    </div>
    
    <div class="plan-card">
      <div>
        <h2>Premium</h2>
        <div class="price">$79/mo</div>
        <ul>
          <li>Unlimited Projects</li>
          <li>500GB Storage</li>
          <li>24/7 Dedicated Support</li>
        </ul>
      </div>
      <a href="#" class="btn">Choose Premium</a>
    </div>
  </div>
</body>
</html>
