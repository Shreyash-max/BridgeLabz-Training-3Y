<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive CSS Cheat Sheet</title>
    <link rel="stylesheet" href="responsive-css-cheat-sheet.css">
</head>

<body>

<header>
    <h1>Responsive CSS Cheat Sheet</h1>
</header>

<main>
    <section class="cheat-sheet">

        <article class="topic">
            <h2>Filters</h2>
            <p><code>filter: grayscale(100%);</code></p>
        </article>

        <article class="topic">
            <h2>Media Queries</h2>
            <p><code>@media (max-width: 700px)</code></p>
        </article>

        <article class="topic">
            <h2>Responsive Design</h2>
            <p><code>width: 100%;</code></p>
        </article>

        <article class="topic">
            <h2>Typography</h2>
            <p><code>font-size: clamp(1rem, 2vw, 2rem);</code></p>
        </article>

        <article class="topic">
            <h2>Flexbox</h2>
            <p><code>display: flex;</code></p>
        </article>

        <article class="topic">
            <h2>Grid</h2>
            <p><code>display: grid;</code></p>
        </article>

    </section>
</main>

<footer>
    <p>CSS Quick Reference</p>
</footer>

</body>
</html>
