<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards Animation</title>
    <link rel="stylesheet" href="filter-cards-animation.css">
</head>

<body>

<header>
    <h1>Our Team</h1>
</header>

<main>
    <section class="profiles">

        <article class="profile-card">
            <img class="gray" src="https://i.pravatar.cc/500?img=12" alt="Profile">
            <h2>Alex</h2>
            <p>Web Developer</p>
        </article>

        <article class="profile-card">
            <img class="sepia" src="https://i.pravatar.cc/500?img=32" alt="Profile">
            <h2>Sarah</h2>
            <p>UI Designer</p>
        </article>

        <article class="profile-card">
            <img class="contrast" src="https://i.pravatar.cc/500?img=56" alt="Profile">
            <h2>John</h2>
            <p>Data Analyst</p>
        </article>

    </section>
</main>

</body>
</html>
