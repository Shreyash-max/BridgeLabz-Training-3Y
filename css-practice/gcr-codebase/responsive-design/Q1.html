<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>

<body>

<header>
    <h1>Image Filter Gallery</h1>
    <p>Different CSS filters applied to images</p>
</header>

<main>
    <section class="gallery">

        <figure class="image-card">
            <img class="blur" src="https://picsum.photos/id/1015/500/350" alt="Mountain">
            <figcaption>Blur Filter</figcaption>
        </figure>

        <figure class="image-card">
            <img class="grayscale" src="https://picsum.photos/id/1025/500/350" alt="Dog">
            <figcaption>Grayscale Filter</figcaption>
        </figure>

        <figure class="image-card">
            <img class="sepia" src="https://picsum.photos/id/1035/500/350" alt="Nature">
            <figcaption>Sepia Filter</figcaption>
        </figure>

        <figure class="image-card">
            <img class="brightness" src="https://picsum.photos/id/1043/500/350" alt="River">
            <figcaption>Brightness Filter</figcaption>
        </figure>

        <figure class="image-card">
            <img class="contrast" src="https://picsum.photos/id/1050/500/350" alt="Forest">
            <figcaption>Contrast Filter</figcaption>
        </figure>

        <figure class="image-card">
            <img class="hue" src="https://picsum.photos/id/106/500/350" alt="Water">
            <figcaption>Hue Rotate Filter</figcaption>
        </figure>

    </section>
</main>

<footer>
    <p>Responsive CSS Assignment</p>
</footer>

</body>
</html>
