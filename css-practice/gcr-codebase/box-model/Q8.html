<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Exploration</title>
    <link rel="stylesheet" href="q8.css">
</head>

<body>

<header>
    <h1>CSS Box Model</h1>
</header>

<main>

    <section class="box-model">

        <div class="margin-layer">

            <div class="border-layer">

                <div class="padding-layer">

                    <div class="content-layer">
                        Content
                    </div>

                </div>

            </div>

        </div>

        <div class="description">
            <h2>Box Model Layers</h2>
            <p><strong>Margin:</strong> Space outside the element.</p>
            <p><strong>Border:</strong> Surrounds the padding.</p>
            <p><strong>Padding:</strong> Space around the content.</p>
            <p><strong>Content:</strong> Actual text or element content.</p>
        </div>

    </section>

</main>

<footer>
    <p>Box Model Practice</p>
</footer>

</body>
</html>
