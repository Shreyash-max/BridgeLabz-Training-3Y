<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors</title>
    <link rel="stylesheet" href="q5.css">
</head>

<body>

<header>
    <h1>Advanced CSS Selectors</h1>
</header>

<main>

    <section class="content">

        <h2>Items List</h2>

        <ul class="items">
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>React</li>
        </ul>

        <div class="links">
            <a href="https://example.com">Secure Link</a>
            <a href="http://example.com">Normal Link</a>
        </div>

        <form>
            <input type="text" placeholder="Enter your name">
            <input type="email" placeholder="Enter email">
        </form>

        <div class="combinators">
            <p>First paragraph</p>
            <p>Second paragraph</p>
            <span>Sibling span</span>
            <p>Third paragraph</p>
        </div>

    </section>

</main>

<footer>
    <p>Advanced Selectors Practice</p>
</footer>

</body>
</html>
