<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Gradients</title>
    <link rel="stylesheet" href="q3.css">
</head>

<body>

<header>
    <h1>CSS Gradient Showcase</h1>
</header>

<main>

    <section class="gradient linear">
        <div>
            <h2>Linear Gradient</h2>
            <p>
                A linear gradient changes colors along a straight line.
            </p>
        </div>
    </section>

    <section class="gradient radial">
        <div>
            <h2>Radial Gradient</h2>
            <p>
                A radial gradient spreads colors from a central point.
            </p>
        </div>
    </section>

</main>

<footer>
    <p>Gradient Background Practice</p>
</footer>

</body>
</html>
