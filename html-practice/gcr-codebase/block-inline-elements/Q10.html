<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Selection</title>
</head>
<body>

    <h1>Travel Selection Page</h1>

    <!-- Country selection -->
    <label for="country">Country:</label>

    <select id="country" name="country">
        <option selected>India</option>
        <option>USA</option>
        <option>France</option>
        <option>Japan</option>
    </select>

    <br><br>

    <!-- State selection -->
    <label for="state">State:</label>

    <select id="state" name="state">
        <option selected>Uttar Pradesh</option>
        <option>Rajasthan</option>
        <option>Goa</option>
        <option>Kerala</option>
    </select>

    <br><br>

    <!-- City selection -->
    <label for="city">City:</label>

    <select id="city" name="city">
        <option selected>Mathura</option>
        <option>Agra</option>
        <option>Jaipur</option>
        <option>Varanasi</option>
    </select>

    <br><br>

    <!-- Tourist place selection -->
    <label for="place">Favorite Tourist Place:</label>

    <select id="place" name="place">
        <option selected>Taj Mahal</option>
        <option>Vrindavan</option>
        <option>Goa Beach</option>
        <option>Kerala Backwaters</option>
    </select>

    <br><br>

    <!-- Summary -->
    <p>
        <strong>My Choices:</strong>
        Country: India,
        State: Uttar Pradesh,
        City: Mathura,
        Favorite Tourist Place: Taj Mahal.
    </p>

</body>
</html>
