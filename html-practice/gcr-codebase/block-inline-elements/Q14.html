<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Database</title>
</head>
<body>

    <h1>Movie Database</h1>

    <!-- Movie table -->
    <table border="1">

        <!-- Caption -->
        <caption>
            <strong>Popular Movies</strong>
        </caption>

        <tr>
            <th title="Name of the movie">Movie Name</th>
            <th title="Movie category">Genre</th>
            <th title="Release year">Year</th>
            <th title="Internet Movie Database rating">
                IMDB Rating
            </th>
            <th>Link</th>
        </tr>

        <tr>
            <td>Inception</td>
            <td>Science Fiction</td>
            <td>2010</td>
            <td>8.8</td>
            <td>
                <a href="https://example.com">
                    View
                </a>
            </td>
        </tr>

        <tr>
            <td>Interstellar</td>
            <td>Science Fiction</td>
            <td>2014</td>
            <td>8.7</td>
            <td>
                <a href="https://example.com">
                    View
                </a>
            </td>
        </tr>

        <tr>
            <td>The Dark Knight</td>
            <td>Action</td>
            <td>2008</td>
            <td>9.0</td>
            <td>
                <a href="https://example.com">
                    View
                </a>
            </td>
        </tr>

        <!-- Colspan -->
        <tr>
            <td colspan="5">
                <strong>End of Movie List</strong>
            </td>
        </tr>

    </table>

    <!-- Note -->
    <p>
        <small>
            Note: IMDB ratings shown here are sample values for educational purposes.
        </small>
    </p>

</body>
</html>
