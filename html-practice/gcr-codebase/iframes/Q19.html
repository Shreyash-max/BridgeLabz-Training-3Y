<!DOCTYPE html>
<html lang="en">
<head>
    <title>Form Security</title>
</head>
<body>
    <form action="#" method="post" autocomplete="off">
        <label for="user">Username:</label>
        <input type="text" id="user" name="username" required><br><br>

        <label for="pass">Password:</label>
        <input type="password" id="pass" name="password" required><br><br>

        <input type="submit" value="Submit">
    </form>

    <p>Note: Turning off autocomplete prevents browsers from caching confidential data, which reduces security risks on shared or public computers.</p>
</body>
</html>
