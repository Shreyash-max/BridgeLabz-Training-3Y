<!DOCTYPE html>
<html lang="en">
<head>
    <title>Payment Form</title>
</head>
<body>
    <form action="#" method="post">
        <label for="cname">Cardholder Name:</label>
        <input type="text" id="cname" name="cardholder_name" required><br><br>

        <label for="cnum">Card Number:</label>
        <input type="text" id="cnum" name="card_number" required><br><br>

        <label for="exp">Expiry Date:</label>
        <input type="text" id="exp" name="expiry_date" placeholder="MM/YY" required><br><br>

        <label for="cvv">CVV:</label>
        <input type="password" id="cvv" name="cvv" maxlength="4" required><br><br>

        <button type="submit">Pay Now</button>
    </form>
</body>
</html>
