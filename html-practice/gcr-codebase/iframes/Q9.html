<!DOCTYPE html>
<html lang="en">
<head>
    <title>File Upload Form</title>
</head>
<body>
    <form action="#" method="post" enctype="multipart/form-data">
        <label for="userfile">Select Image:</label>
        <input type="file" id="userfile" name="userfile" accept=".jpg, .png"><br><br>
        <p>Note: Only files with .jpg or .png extension are allowed for upload.</p>
        <input type="submit" value="Upload File">
    </form>
</body>
</html>
