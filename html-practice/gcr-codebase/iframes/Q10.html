<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact Form</title>
</head>
<body>
    <form action="#" method="post">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter full name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter email address" required><br><br>

        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="subject" placeholder="Enter subject" required><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" placeholder="Type your message here..." required></textarea><br><br>

        <input type="submit" value="Send Message">
    </form>
</body>
</html>
