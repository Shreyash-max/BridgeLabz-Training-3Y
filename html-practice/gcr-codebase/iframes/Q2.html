<!DOCTYPE html>
<html lang="en">
<head>
    <title>Google Map Embed</title>
</head>
<body>
    <!-- The loading="lazy" attribute defers loading the iframe until it comes within a calculated distance from the viewport, improving initial page loading speed. -->
    <iframe title="Google Map" src="https://maps.google.com/maps?q=London&t=&z=13&ie=UTF8&iwloc=&output=embed" width="600" height="450" loading="lazy"></iframe>
</body>
</html>
