<!DOCTYPE html>
<html lang="en">
<head>
    <title>Quotations Demo</title>
</head>
<body>
    <p>In web design, <q>simplicity &amp; clarity lead to usability</q>.</p>

    <blockquote cite="https://example.com">
        This is a long quotation set apart as a distinct block of text within the web document to convey a full paragraph excerpt.
    </blockquote>
</body>
</html>
