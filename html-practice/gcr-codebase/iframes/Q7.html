<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login Form</title>
</head>
<body>
    <!-- A CSRF (Cross-Site Request Forgery) token is a secret, unique value generated by the server to verify that the request originated from the authentic user and not a malicious third-party site. -->
    <form action="#" method="post">
        <input type="hidden" name="csrf_token" value="abc123xyz456token">

        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <input type="submit" value="Login">
    </form>
</body>
</html>
