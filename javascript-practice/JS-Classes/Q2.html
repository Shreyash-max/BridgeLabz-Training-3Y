<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Form Validator</title>
    <style>
        body { font-family: Arial; margin: 30px; }
        input { display: block; margin: 8px 0; padding: 10px; width: 280px; }
        .error { color: red; font-size: 13px; }
        .valid { border: 2px solid green; }
        .invalid { border: 2px solid red; }
    </style>
</head>
<body>
    <h2>Student Registration Form</h2>

    <form id="studentForm" novalidate>
        <input id="name" placeholder="Name" required>
        <small id="nameError" class="error"></small>

        <input id="email" placeholder="Email" required>
        <small id="emailError" class="error"></small>

        <input id="phone" placeholder="10-digit Phone" required>
        <small id="phoneError" class="error"></small>

        <input id="password" type="password" placeholder="Password" required>
        <small id="passwordError" class="error"></small>

        <button type="submit">Register</button>
    </form>

    <p id="result"></p>

    <script>
        const form = document.getElementById("studentForm");

        // Validation rules for each field
        const rules = {
            name: {
                regex: /^[A-Za-z ]+$/,
                message: "Name must contain alphabets only."
            },
            email: {
                regex: /^[^\s@]+@[^\s@]+\.[^\s@]+$/,
                message: "Enter a valid email address."
            },
            phone: {
                regex: /^\d{10}$/,
                message: "Phone must contain exactly 10 digits."
            },
            password: {
                regex: /^(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9\s])\S+$/,
                message: "Password needs uppercase, number and special character."
            }
        };

        function validateField(id) {
            const input = document.getElementById(id);
            const error = document.getElementById(id + "Error");
            const rule = rules[id];

            const isValid = rule.regex.test(input.value.trim());

            input.classList.toggle("valid", isValid);
            input.classList.toggle("invalid", !isValid);
            error.textContent = isValid ? "" : rule.message;

            return isValid;
        }

        // Validate fields while typing
        Object.keys(rules).forEach(id => {
            document.getElementById(id).addEventListener("input", () => {
                validateField(id);
            });
        });

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const isValid = Object.keys(rules)
                .map(validateField)
                .every(Boolean);

            document.getElementById("result").textContent =
                isValid ? "Registration successful!" : "Please correct the errors.";
        });
    </script>
</body>
</html>
