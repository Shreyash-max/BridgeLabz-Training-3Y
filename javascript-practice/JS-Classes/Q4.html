<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Custom Form Builder</title>
    <style>
        body { font-family: Arial; margin: 30px; }
        input, select { display: block; margin: 8px 0 15px; padding: 8px; }
        pre { background: #eee; padding: 12px; }
    </style>
</head>
<body>
    <h2>Dynamic Form Builder</h2>
    <div id="formContainer"></div>
    <pre id="output"></pre>

    <script>
        class FormBuilder {
            constructor(fields) {
                this.fields = fields;
            }

            createForm() {
                const container = document.getElementById("formContainer");

                // Create form fields dynamically
                container.innerHTML = `
                    <form id="dynamicForm">
                        ${this.fields.map((field, index) => `
                            <label for="field${index}">${field.label}</label>
                            <input type="${field.type}"
                                   id="field${index}"
                                   name="${field.name}"
                                   required>
                        `).join("")}
                        <button type="submit">Submit</button>
                    </form>
                `;

                document.getElementById("dynamicForm")
                    .addEventListener("submit", event => {
                        event.preventDefault();
                        document.getElementById("output").textContent =
                            JSON.stringify(this.getFormData(), null, 2);
                    });
            }

            getFormData() {
                const data = {};
                this.fields.forEach((field, index) => {
                    data[field.name] =
                        document.getElementById(`field${index}`).value;
                });
                return data;
            }
        }

        // Define fields using an array
        const fields = [
            { type: "text", label: "Username", name: "username" },
            { type: "email", label: "Email", name: "email" },
            { type: "password", label: "Password", name: "password" }
        ];

        const builder = new FormBuilder(fields);
        builder.createForm();
    </script>
</body>
</html>
