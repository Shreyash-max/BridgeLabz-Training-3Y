<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q4 - Theme Switcher</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script>
</head>
<body data-theme="light"><main class="container">
  <h1>Theme Switcher</h1><p>Choose a theme to change the page appearance.</p>
  <div class="actions"><button data-theme-choice="light">Light</button><button data-theme-choice="dark">Dark</button><button data-theme-choice="blue">Blue</button></div>
  <p>Current theme: <strong id="currentTheme">light</strong></p>
</main></body></html>
