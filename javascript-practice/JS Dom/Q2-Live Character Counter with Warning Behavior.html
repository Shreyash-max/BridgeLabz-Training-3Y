<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q2 - Character Counter</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script>
</head>
<body><main class="container">
  <h1>Live Character Counter</h1>
  <label for="message">Message (maximum 100 characters)</label>
  <textarea id="message" maxlength="100" rows="6" placeholder="Start typing..."></textarea>
  <p id="counter" aria-live="polite">100 characters remaining</p>
  <button id="resetButton" type="button">Reset</button>
</main></body></html>
