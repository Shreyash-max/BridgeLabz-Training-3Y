<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q9 - Form Validation</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script>
</head>
<body><main class="container"><h1>Form Submit Blocker</h1>
  <form id="userForm" novalidate>
    <label for="name">Name</label><input id="name" name="name" autocomplete="name">
    <small class="error" id="nameError"></small>
    <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email">
    <small class="error" id="emailError"></small>
    <label for="password">Password</label><input id="password" name="password" type="password">
    <small class="error" id="passwordError"></small>
    <button type="submit">Submit</button>
  </form>
  <p id="successMessage" role="status" hidden>Form Submitted Successfully</p>
</main></body></html>
