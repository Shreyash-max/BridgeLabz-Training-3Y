<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q8 - Custom Dropdown</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script>
</head>
<body><main class="container"><h1>Custom Dropdown</h1>
  <div class="dropdown" id="dropdown">
    <button id="dropdownButton" type="button" aria-expanded="false">Choose a branch ▾</button>
    <div id="options" class="options" hidden>
      <button type="button" data-value="Computer Science">Computer Science</button>
      <button type="button" data-value="Information Technology">Information Technology</button>
      <button type="button" data-value="Electronics">Electronics</button>
      <button type="button" data-value="Mechanical">Mechanical</button>
    </div>
  </div>
  <p id="selection">Selected: None</p>
</main></body></html>
