<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q5 - Image Gallery</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script>
</head>
<body><main class="container"><h1>Image Gallery</h1><p>Click any image to preview it.</p>
  <div class="gallery" id="gallery">
    <img src="https://picsum.photos/id/1015/500/350" alt="Mountain river">
    <img src="https://picsum.photos/id/1016/500/350" alt="Forest landscape">
    <img src="https://picsum.photos/id/1025/500/350" alt="Dog portrait">
    <img src="https://picsum.photos/id/1035/500/350" alt="Green hills">
    <img src="https://picsum.photos/id/1043/500/350" alt="Coastal landscape">
    <img src="https://picsum.photos/id/1069/500/350" alt="Ocean waves">
  </div>
</main>
<div class="modal" id="modal" hidden><div class="modal-content" id="modalContent"><button id="closeModal" aria-label="Close preview">×</button><img id="previewImage" alt=""></div></div>
</body></html>
